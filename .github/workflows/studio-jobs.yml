name: Studio jobs

# Started by the hosted Editing Studio (studio-app/) or by hand from the Actions tab.
# Does the heavy work that cannot run on Vercel: preview copies, transcription, ingest analysis,
# page screenshots and renders. Reads and writes the app's Vercel Blob store.
#
# Needs repo secrets: BLOB_READ_WRITE_TOKEN (same store as the app) and GROQ_API_KEY (transcription).

run-name: studio ${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      id:
        description: "Job id (the app uses it to track status)"
        required: true
        type: string
      job:
        description: "prepare, ingest, import, shot, render, fxcheck or anim"
        required: true
        type: string
      args:
        description: "JSON arguments for the job"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: studio-${{ inputs.id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB: ${{ inputs.job }}
      ARGS: ${{ inputs.args }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Check the job name
        run: |
          case "$JOB" in prepare|ingest|import|shot|render|fxcheck|anim) ;; *) echo "::error::Unknown job: $JOB"; exit 1;; esac
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then echo "::error::Missing repo secret BLOB_READ_WRITE_TOKEN"; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgles2
          pip install --quiet pillow numpy

      - name: Install Bun (the reanimate skill names the easing of grabbed animations)
        if: ${{ inputs.job == 'anim' }}
        uses: oven-sh/setup-bun@v2

      - name: Install the effects skill's packages (face tracking, cut-outs)
        if: ${{ inputs.job == 'render' || inputs.job == 'fxcheck' }}
        run: pip install --quiet -r .claude/skills/effects/requirements.txt

      - name: Install the Blob helper
        working-directory: studio-app
        run: npm install --no-audit --no-fund

      - name: Install a browser for screenshots
        if: ${{ inputs.job == 'shot' }}
        run: npm install -g playwright && npx playwright install --with-deps chromium

      - name: Run the job
        run: |
          export NODE_PATH="$(npm root -g)"
          python3 .claude/editing-studio/tools/studio_job.py "$JOB" "$ARGS"
